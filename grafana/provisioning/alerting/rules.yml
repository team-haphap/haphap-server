apiVersion: 1

groups:
  - orgId: 1
    name: haphap-server-alerts
    folder: Haphap
    interval: 1m
    rules:

      # 1) 앱 서버 다운 감지
      - uid: app-down
        title: "앱 서버 다운"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "up{job=\"haphap-server\"} == 0"
              instant: true
              refId: A
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "haphap-server가 Prometheus에 응답하지 않습니다. 컨테이너 상태를 확인하세요."

      # 2) 5xx 에러율 급등
      - uid: high-error-rate
        title: "5xx 에러율 5% 초과"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "sum(rate(http_server_requests_seconds_count{status=~\"5..\",job=\"haphap-server\"}[5m]))"
              instant: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "sum(rate(http_server_requests_seconds_count{job=\"haphap-server\"}[5m]))"
              instant: true
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A / $B"
              refId: C
            relativeTimeRange:
              from: 0
              to: 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "5xx 에러 비율이 5%를 초과했습니다. 최근 배포나 외부 의존성 장애를 확인하세요."

      # 3) 응답 지연 (p95 > 3초)
      - uid: high-latency
        title: "API 응답 지연 (p95 > 3s)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"haphap-server\"}[5m])) by (le)) > 3"
              instant: true
              refId: A
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API p95 응답시간이 3초를 초과했습니다. 슬로우 쿼리 또는 외부 API 지연을 확인하세요."

      # 4) JVM 힙 메모리 85% 초과
      - uid: high-heap-usage
        title: "JVM 힙 메모리 85% 초과"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "sum(jvm_memory_used_bytes{area=\"heap\",job=\"haphap-server\"}) / sum(jvm_memory_max_bytes{area=\"heap\",job=\"haphap-server\"}) > 0.85"
              instant: true
              refId: A
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 힙 사용률이 85%를 초과했습니다. 메모리 누수 또는 GC 튜닝이 필요할 수 있습니다."
